spring.application.name=project_3

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project3_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arsen_vaits}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.bucket-name=${AWS_BUCKET_NAME:arsen-blog-api}
aws.region=${AWS_REGION:eu-north-1}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.root=WARN